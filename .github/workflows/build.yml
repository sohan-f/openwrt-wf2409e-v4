name: Build WF2409E v4 OpenWrt

on:
  push:
    branches: [wf2409e-v4]
  workflow_dispatch:

jobs:
  build:
    # Pinned 22.04: python3-distutils still exists (removed from 24.04's
    # python3.12), and it is the documented OpenWrt build host baseline.
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      FORCE_UNSAFE_CONFIGURE: 1
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Clean up runner disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.2.0"
          testing: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache clang curl diffutils \
            file flex gawk gettext git libelf-dev libncurses-dev libsnappy-dev \
            libssl-dev libtool lld llvm patch perl python3 python3-distutils \
            python3-setuptools python3-yaml rsync subversion swig time unzip \
            wget xz-utils zlib1g-dev

      - uses: actions/checkout@v4

      # dl lives inside the tree (TOPDIR/dl); build.sh carries it across the
      # fresh clone. Loose key on purpose: stale tarballs are harmless because
      # OpenWrt checksum-verifies every download anyway.
      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: build/openwrt/dl
          key: wf2409e-v4-dl-v2
          restore-keys: |
            wf2409e-v4-dl-

      # staging_dir holds installed host tools/cross-toolchain; build_dir's
      # host and toolchain subtrees hold their build stamps and intermediates.
      # Cache both so make toolchain/install can be a true no-op on a hit.
      # Strict key, no restore-keys: inputs must match exactly.
      #
      # Key lists toolchain-determining inputs ONLY: the tree pin inside
      # build.sh and the 0001 endian patch (ARCH, config-6.18). Patches
      # 0002..0005 touch DTS / board metadata / image recipes and cannot
      # affect the toolchain or kernel headers — listing them (or seed.config
      # package selections) would invalidate the cache on every bring-up fix.
      # EXTEND THIS LIST if a patch ever starts touching kernel include/uapi
      # or anything the toolchain consumes.
      - name: Restore host tools and cross-toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/openwrt/staging_dir
            build/openwrt/build_dir/host
            build/openwrt/build_dir/toolchain-*
          key: wf2409e-v4-toolchain-${{ hashFiles('build.sh', 'patches/0001-*.patch') }}

      # Compiler results are content-addressed by ccache, so a broad restore
      # prefix is safe across source/config changes. A new run key lets the
      # cache grow after each build; ccache itself is capped at 2 GB above.
      - name: Restore compiler cache
        id: ccache-cache
        uses: actions/cache/restore@v5
        with:
          path: build/ccache
          key: wf2409e-v4-ccache-${{ github.run_id }}
          restore-keys: wf2409e-v4-ccache-

      - name: Build
        run: ./build.sh

      # Firmware artifacts are already copied to build/artifacts by build.sh.
      # Drop the large target-side intermediates before cache archives are made.
      - name: Free space before saving caches
        if: always()
        run: rm -rf build/openwrt/build_dir/target-* build/openwrt/bin build/openwrt/logs

      # Save as soon as toolchain/install has completed, even when a later
      # kernel/package/image step fails.
      - name: Save host tools and cross-toolchain
        if: always() && steps.toolchain-cache.outputs.cache-hit != 'true' && hashFiles('build/openwrt/staging_dir/.wf2409e-toolchain-ready') != ''
        uses: actions/cache/save@v5
        with:
          path: |
            build/openwrt/staging_dir
            build/openwrt/build_dir/host
            build/openwrt/build_dir/toolchain-*
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: always() && steps.ccache-cache.outputs.cache-hit != 'true' && hashFiles('build/ccache/**') != ''
        uses: actions/cache/save@v5
        with:
          path: build/ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wf2409e-v4-images
          path: |
            build/artifacts/
          if-no-files-found: error
