name: Build WF2409E v4 OpenWrt

on:
  push:
    branches: [wf2409e-v4]
  workflow_dispatch:

jobs:
  build:
    # Pinned 22.04: python3-distutils still exists (removed from 24.04's
    # python3.12), and it is the documented OpenWrt build host baseline.
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      # Container jobs run as root; GNU tar's configure refuses that otherwise.
      FORCE_UNSAFE_CONFIGURE: 1

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache clang curl diffutils \
            file flex gawk gettext git libelf-dev libncurses-dev libsnappy-dev \
            libssl-dev libtool lld llvm patch perl python3 python3-distutils \
            python3-setuptools python3-yaml rsync subversion swig time unzip \
            wget xz-utils zlib1g-dev

      - uses: actions/checkout@v4

      # dl lives inside the tree (TOPDIR/dl); build.sh carries it across the
      # fresh clone. Loose key on purpose: stale tarballs are harmless because
      # OpenWrt checksum-verifies every download anyway.
      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: build/openwrt/dl
          key: wf2409e-v4-dl-v2
          restore-keys: |
            wf2409e-v4-dl-

      # staging_dir holds BOTH the host tools and the cross-toolchain — the
      # ~2/3 of wall time that only depends on the OpenWrt pin and the endian
      # patch. Strict key, no restore-keys: resuming from a staging dir built
      # from different inputs would silently produce a mismatched toolchain,
      # so any input change rebuilds it cold instead.
      #
      # Key lists toolchain-determining inputs ONLY: the tree pin inside
      # build.sh and the 0001 endian patch (ARCH, config-6.18). Patches
      # 0002..0005 touch DTS / board metadata / image recipes and cannot
      # affect the toolchain or kernel headers — listing them (or seed.config
      # package selections) would invalidate the cache on every bring-up fix.
      # EXTEND THIS LIST if a patch ever starts touching kernel include/uapi
      # or anything the toolchain consumes.
      - name: Cache host tools and cross-toolchain
        uses: actions/cache@v4
        with:
          path: build/openwrt/staging_dir
          key: wf2409e-v4-toolchain-${{ hashFiles('build.sh', 'patches/0001-*.patch') }}

      - name: Build
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wf2409e-v4-images
          path: |
            build/artifacts/
          if-no-files-found: error
