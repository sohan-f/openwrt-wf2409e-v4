name: Build WF2409E v4 OpenWrt

on:
  push:
    branches: [wf2409e-v4]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # Container jobs run as root; GNU tar's configure refuses that otherwise.
      FORCE_UNSAFE_CONFIGURE: 1

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache clang curl diffutils \
            file flex gawk gettext git libelf-dev libncurses-dev libsnappy-dev \
            libssl-dev libtool lld llvm patch perl python3 python3-distutils \
            python3-setuptools rsync subversion swig unzip wget xz-utils zlib1g-dev

      - uses: actions/checkout@v4

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: build/dl
          key: wf2409e-v4-dl-${{ hashFiles('seed.config') }}
          restore-keys: |
            wf2409e-v4-dl-

      - name: Build
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wf2409e-v4-images
          path: |
            build/artifacts/
          if-no-files-found: error
